version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: typing-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: typing_game
      POSTGRES_PASSWORD: typing_game
      POSTGRES_DB: typing_game
    ports:
      - "5432:5432"
    volumes:
      - typing_game_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typing_game"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate, disposable database used only by the automated test suite so
  # tests never touch dev data. Run `bun test` from ./backend against this.
  postgres_test:
    image: postgres:16-alpine
    container_name: typing-game-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: typing_game_test
      POSTGRES_PASSWORD: typing_game_test
      POSTGRES_DB: typing_game_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typing_game_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: typing-game-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://typing_game:typing_game@postgres:5432/typing_game?schema=public"
      JWT_SECRET: "change-this-in-production"
      CORS_ORIGIN: "http://localhost:3000"
      NODE_ENV: "production"
      PORT: 4000
    ports:
      - "4000:4000"
    command: sh -c "bunx prisma migrate deploy && bun run start"

volumes:
  typing_game_pgdata:
